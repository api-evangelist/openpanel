openapi: 3.2.0
info:
  title: OpenPanel Profile API
  version: 1.0.0
  description: Identify and update user profiles
tags:
- name: Profile
  description: Identify and update user profiles
paths:
  /profile/:
    post:
      tags:
      - Profile
      description: Identify or update a user profile.
      responses:
        '200':
          description: Default Response
      summary: Create profile
      x-summary-source: derived
      operationId: postProfile
      x-operation-id-source: derived
  /profile/increment:
    post:
      tags:
      - Profile
      description: Increment a numeric property on a user profile.
      responses:
        '200':
          description: Default Response
      summary: Create profile increment
      x-summary-source: derived
      operationId: postProfileIncrement
      x-operation-id-source: derived
  /profile/decrement:
    post:
      tags:
      - Profile
      description: Decrement a numeric property on a user profile.
      responses:
        '200':
          description: Default Response
      summary: Create profile decrement
      x-summary-source: derived
      operationId: postProfileDecrement
      x-operation-id-source: derived
