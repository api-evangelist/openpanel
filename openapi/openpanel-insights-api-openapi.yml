          - 6m
          - 12m
          - monthToDate
          - lastMonth
          - yearToDate
          - lastYear
          - custom
        in: query
        name: range
      - schema:
          type: string
        in: query
        name: search
      - schema:
          type: string
          enum:
          - sessions
          - pageviews
          - bounce_rate
          - avg_duration
        in: query
        name: sortBy
      - schema:
          type: string
          enum:
          - asc
          - desc
        in: query
        name: sortOrder
      - schema:
          default: 50
          type: integer
          minimum: 1
          maximum: 500
        in: query
        name: limit
      - schema:
          type: string
        in: path
        name: projectId
        required: true
      responses:
        '200':
          description: Default Response
      summary: Get insights by project id pages performance
      x-summary-source: derived
      operationId: getInsightsByProjectIdPagesPerformance
      x-operation-id-source: derived
  /insights/{projectId}/metrics:
    get:
      tags:
      - Insights
      description: Get aggregated website metrics including sessions, pageviews, and bounce rate.
      parameters:
      - schema:
          anyOf:
          - type: string
          - type: 'null'
        in: query
        name: startDate
      - schema:
          anyOf:
          - type: string
          - type: 'null'
        in: query
        name: endDate
      - schema:
          default: 7d
          type: string
          enum:
          - 30min
          - lastHour
          - today
          - yesterday
          - 7d
          - 30d
          - 6m
          - 12m
          - monthToDate
          - lastMonth
          - yearToDate
          - lastYear
          - custom
        in: query
        name: range
      - schema:
          default: []
          type: array
          items:
            type: object
            properties:
              id:
                description: Unique identifier for the filter
                type: string
              name:
                type: string
                description: The property name to filter on
              operator:
                type: string
                enum:
                - is
                - isNot
                - contains
                - doesNotContain
                - startsWith
                - endsWith
                - regex
                - isNull
                - isNotNull
                - gt
                - lt
                - gte
                - lte
                - inCohort
                - notInCohort
                description: The operator to use for the filter
              value:
                type: array
                items:
                  anyOf:
                  - anyOf:
                    - anyOf:
                      - type: string
                      - type: number
                    - type: boolean
                  - type: 'null'
                description: The values to filter on
              cohortId:
                description: Cohort ID when using inCohort/notInCohort operators
                type: string
            required:
            - name
            - operator
            - value
        in: query
        name: filters
      - schema:
          type: string
        in: path
        name: projectId
        required: true
      responses:
        '200':
          description: Default Response
      summary: Get insights by project id metrics
      x-summary-source: derived
      operationId: getInsightsByProjectIdMetrics
      x-operation-id-source: derived
