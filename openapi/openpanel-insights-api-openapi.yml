openapi: 3.2.0
info:
  title: OpenPanel Insights API
  version: 1.0.0
  description: Query analytics data
tags:
- name: Insights
  description: Query analytics data
paths:
  /insights/{projectId}/overview:
    get:
      tags:
      - Insights
      description: Get an overview of key metrics for the project (sessions, pageviews, bounce rate, duration).
      parameters:
      - schema:
          type: string
        in: query
        name: startDate
      - schema:
          type: string
        in: query
        name: endDate
      - schema:
          type: string
          enum:
          - 30min
          - lastHour
          - today
          - yesterday
          - 7d
          - 30d
          - 6m
          - 12m
          - monthToDate
          - lastMonth
          - yearToDate
          - lastYear
          - custom
        in: query
        name: range
      - schema:
          type: string
          enum:
          - hour
          - day
          - week
          - month
        in: query
        name: interval
      - schema:
          type: string
        in: path
        name: projectId
        required: true
      responses:
        '200':
          description: Default Response
      summary: Get insights by project id overview
      x-summary-source: derived
      operationId: getInsightsByProjectIdOverview
      x-operation-id-source: derived
  /insights/{projectId}/active_users:
    get:
      tags:
      - Insights
      description: Get rolling active user counts over the last N days.
      parameters:
      - schema:
          default: 7
          type: integer
          minimum: 1
          maximum: 90
        in: query
        name: days
      - schema:
          type: string
        in: path
        name: projectId
        required: true
      responses:
        '200':
          description: Default Response
      summary: Get insights by project id active users
      x-summary-source: derived
      operationId: getInsightsByProjectIdActiveUsers
      x-operation-id-source: derived
  /insights/{projectId}/retention:
    get:
      tags:
      - Insights
      description: Get weekly retention series data.
      parameters:
      - schema:
          type: string
        in: path
        name: projectId
        required: true
      responses:
        '200':
          description: Default Response
      summary: Get insights by project id retention
      x-summary-source: derived
      operationId: getInsightsByProjectIdRetention
      x-operation-id-source: derived
  /insights/{projectId}/retention/cohort:
