  /insights/{projectId}/pages/top:
    get:
      tags:
      - Insights
      description: Get the top pages by pageviews for the given date range.
      parameters:
      - schema:
          type: string
        in: query
        name: startDate
      - schema:
          type: string
        in: query
        name: endDate
      - schema:
          type: string
          enum:
          - 30min
          - lastHour
          - today
          - yesterday
          - 7d
          - 30d
          - 6m
          - 12m
          - monthToDate
          - lastMonth
          - yearToDate
          - lastYear
