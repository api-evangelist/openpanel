          enum:
          - entry
          - exit
        in: query
        name: mode
      - schema:
          type: string
        in: path
        name: projectId
        required: true
      responses:
        '200':
          description: Default Response
      summary: Get insights by project id pages entry exit
      x-summary-source: derived
      operationId: getInsightsByProjectIdPagesEntryExit
      x-operation-id-source: derived
