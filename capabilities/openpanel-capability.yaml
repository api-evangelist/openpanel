naftiko: 1.0.0-alpha2
info:
  label: OpenPanel API
  description: OpenPanel API API capability.
  tags:
  - Openpanel
  - API
  created: '2026-05-06'
  modified: '2026-05-06'
capability:
  consumes:
  - type: http
    namespace: openpanel
    baseUri: https://api.example.com
    description: OpenPanel API HTTP API.
    resources:
    - name: event
      path: /event/
      operations:
      - name: post-event
        method: POST
        description: Deprecated direct event ingestion endpoint. Use /track instead.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: profile
      path: /profile/
      operations:
      - name: post-profile
        method: POST
        description: Identify or update a user profile.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: profile-increment
      path: /profile/increment
      operations:
      - name: post-profile-increment
        method: POST
        description: Increment a numeric property on a user profile.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: profile-decrement
      path: /profile/decrement
      operations:
      - name: post-profile-decrement
        method: POST
        description: Decrement a numeric property on a user profile.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: export-events
      path: /export/events
      operations:
      - name: get-export-events
        method: GET
        description: Export a paginated list of raw events with optional filtering by date, profile, and event type.
        inputParameters:
        - name: project_id
          in: query
          type: string
        - name: projectId
          in: query
          type: string
        - name: profileId
          in: query
          type: string
        - name: event
          in: query
          type: string
        - name: start
          in: query
          type: string
        - name: end
          in: query
          type: string
        - name: page
          in: query
          type: number
        - name: limit
          in: query
          type: number
        - name: includes
          in: query
          type: array
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: export-charts
      path: /export/charts
      operations:
      - name: get-export-charts
        method: GET
        description: Export aggregated chart/analytics data for a series of events over a time range.
        inputParameters:
        - name: breakdowns
          in: query
          type: array
          description: Array of dimensions to break down the data by
        - name: interval
          in: query
          type: string
          description: The time interval for data aggregation (e.g., day, week, month)
        - name: range
          in: query
          type: string
          description: The time range for which data should be displayed
        - name: previous
          in: query
          type: boolean
          description: Whether to show data from the previous period for comparison
        - name: startDate
          in: query
          type: string
          description: Custom start date for the data range (overrides range if provided)
        - name: endDate
          in: query
          type: string
          description: Custom end date for the data range (overrides range if provided)
        - name: project_id
          in: query
          type: string
        - name: projectId
          in: query
          type: string
        - name: series
          in: query
          type: array
        - name: events
          in: query
          type: array
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: import-events
      path: /import/events
      operations:
      - name: post-import-events
        method: POST
        description: Bulk import historical events.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
